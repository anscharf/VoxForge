[package]
name = "voxforge"
version = "1.0.0"
description = "VoxForge - Voice-to-Text Desktop Application with AI Enrichment"
authors = ["VoxForge Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "voxforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voxforge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Audio recording
cpal = "0.15"
hound = "3.5"

# HTTP client for Ollama and OpenAI
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }

# Logging
log = "0.4"

# Path handling
dirs = "5"

# UUID for temp files
uuid = { version = "1", features = ["v4"] }

# Async streams for Ollama streaming
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS specific dependencies if needed

[target.'cfg(target_os = "windows")'.dependencies]
# Windows specific dependencies if needed
